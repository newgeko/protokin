<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>PROTOKIN - Enquête sur nos pratiques descriptives</title>

  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Protokin enquête sur les conditions, fonctions et transformations par lesquelles des pratiques rendent certaines différences descriptibles, discutables, justifiables, stabilisables, contestables et révisables.">
  <meta name="keywords" content="Protokin, pratiques descriptives, enquête, pragmatique, inférentielle, réflexivité, description, référence, justification">
  <meta name="author" content="PROTOKIN Project">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@300;400;600;700&family=Noto+Serif:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

  <!-- Docsify theme -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">

  <!-- KaTeX -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@latest/dist/katex.min.css"/>

  <!-- Custom CSS -->
  <link rel="stylesheet" href="./style.css">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="./assets/favicon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="./assets/apple-touch-icon.png">

  <meta name="robots" content="index, follow">
</head>

<body>

  <div id="app">Initialisation de l'enquête...</div>

  <!-- =========================
       MERMAID
  ========================= -->
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <script>
    mermaid.initialize({
      startOnLoad: false,
      theme: "default"
    });
  </script>

  <!-- =========================
       DOCSIFY CONFIG
  ========================= -->
  <script>
    window.$docsify = {
      name: 'PROTOKIN',

      repo: '',

      loadSidebar: '_sidebar.md',
      autoHeader: true,
      subMaxLevel: 3,
      auto2top: true,
      homepage: 'README.md',

      latex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']],
      },

      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: 'Rechercher un concept (ontologie, individuation...)',
        noData: 'Aucun concept trouvé.',
        depth: 4
      },

      pagination: {
        previousText: 'Phase Précédente',
        nextText: 'Phase Suivante',
        crossChapter: true
      },

      plugins: [

        // =========================
        // MERMAID RENDER
        // =========================
        function (hook) {
          hook.doneEach(function () {

            setTimeout(() => {

              if (!window.mermaid) return;

              const blocks = document.querySelectorAll(
                'code.language-mermaid, code.lang-mermaid'
              );

              blocks.forEach(block => {
                const pre = block.parentElement;
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.textContent;
                pre.parentElement.replaceChild(div, pre);
              });

              mermaid.init(undefined, document.querySelectorAll('.mermaid'));

            }, 0);

          });
        },

        // =========================
        // FOOTER + NAVIGATION PROTOKIN
        // =========================
        function (hook) {

          hook.afterEach(function (html) {

            const year = new Date().getFullYear();

            const regimes = [
              "Physico-dynamique",
              "Cognitif",
              "Biologique",
              "Socio-développemental",
              "Normatif",
              "Métathéorique"
            ];

            const regime =
              regimes[Math.floor(Math.random() * regimes.length)];

            return html + `
              <hr style="margin-top:3rem;border:0;border-top:1px solid var(--border-color);" />

              <footer style="
                text-align:center;
                font-family:'Noto Sans',sans-serif;
                font-size:0.85em;
                padding:30px 0;
                color:#888;
                line-height:1.8;
              ">

                <!-- NAVIGATION -->
                <div style="margin-bottom:12px;">
                  <a href="#/">Accueil</a> |
                  <a href="#/">Entrée</a> |
                  <a href="#/">Documents</a>
                </div>

                <!-- META -->
                <div>© ${year} PROTOKIN</div>
                <div>Régime actif : <strong>${regime}</strong></div>
                <div>2026</div>

              </footer>
            `;
          });

        }

      ]
    };
  </script>

  <!-- =========================
       DOCSIFY CORE
  ========================= -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>

  <!-- SEARCH -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>

  <!-- KA TeX -->
  <script src="https://cdn.jsdelivr.net/npm/katex@latest/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-latex@0"></script>

  <!-- PAGINATION -->
  <script src="https://cdn.jsdelivr.net/npm/docsify-pagination/dist/docsify-pagination.min.js"></script>

  <!-- ZOOM IMAGE -->
  <script src="https://cdn.jsdelivr.net/npm/docsify/lib/plugins/zoom-image.min.js"></script>

</body>
</html>
